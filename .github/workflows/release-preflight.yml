name: Release Preflight

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HWP_CLI_VERSION: "0.4.1"
  HWP_CLI_SHA256: "61db250203d40d8aa528b14c380be0cf08e6bfdbecc0cd99748c0d7ec95326d5"
  HWP_CLI: ${{ github.workspace }}/.cache/hwp-cli/hwp
  HWPX_EXPECT_HWP_VERSION: "0.4.1"

jobs:
  release-preflight:
    name: make release-preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Setup Python for live HWPX skill tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: skills/skills/hwpx/requirements-test.txt

      - name: Install pinned hwp-cli for live HWPX skill tests
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/hwp-${HWP_CLI_VERSION}-linux.tar.gz"
          mkdir -p "$(dirname "$HWP_CLI")"
          curl -fsSL --retry 3 \
            "https://github.com/STAIxBWLB/hwp-cli/releases/download/v${HWP_CLI_VERSION}/hwp-v${HWP_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$HWP_CLI_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$(dirname "$HWP_CLI")"
          test "$("$HWP_CLI" --version)" = "hwp ${HWP_CLI_VERSION}"
          "$HWP_CLI" new --help | grep -F -- "--preset"
          "$HWP_CLI" validate --help | grep -F -- "--json"
          "$HWP_CLI" fill --help >/dev/null
          "$HWP_CLI" slots --help >/dev/null

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-preflight-ubuntu-22.04

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run release preflight
        run: make release-preflight
