# TEMPORARY diagnostic workflow on diag/nohup-linux only; never merged.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    name: linux nohup diag
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ubuntu-22.04-validation
          save-if: false
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Run diagnostic and the failing test
        working-directory: src-tauri
        run: |
          ls -l /bin/sh
          cargo test --lib terminal::phase09_02::diag_nohup_linux_timeline -- --nocapture --test-threads=1 || true
          cargo test --lib terminal::phase09_02::phase09_02_hup_trapping -- --nocapture --test-threads=1 || true
