name: CI
# Unrelated labels neither cancel validation nor replace the required ci-ok check.
run-name: "${{ (github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'native-e2e') && format('CI ignored label PR #{0}', github.event.pull_request.number) || github.event_name == 'pull_request' && format('CI PR #{0}', github.event.pull_request.number) || format('CI {0}', github.sha) }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - docs/**
      - .planning/**
      - .github/**/*.md
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ (github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'native-e2e') && format('ignored-label-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  decision:
    name: CI decision
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      run_full: ${{ steps.dedupe.outputs.run_full }}
      run_e2e: ${{ steps.dedupe.outputs.run_e2e }}
      run_native: ${{ steps.dedupe.outputs.run_native }}
      run_native_compile: ${{ steps.dedupe.outputs.run_native_compile }}
      run_geometry: ${{ steps.dedupe.outputs.run_geometry }}
      macos_deferred: ${{ steps.dedupe.outputs.macos_deferred }}

    steps:
      - name: Checkout CI policy
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci-policy.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node for policy only
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Classify PR changes
        id: classify
        if: github.event_name == 'pull_request' && !((github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'native-e2e'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/ci-files.json"; then
            echo "::error::PR changed-file lookup failed; check pull-requests read permission and rerun CI."
            exit 1
          fi
          node scripts/ci-policy.mjs classify "$RUNNER_TEMP/ci-files.json" "$GITHUB_EVENT_PATH"

      - name: Decide intended validation
        id: dedupe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_RUN_FULL: ${{ steps.classify.outputs.run_full }}
          PR_RUN_E2E: ${{ steps.classify.outputs.run_e2e }}
          PR_RUN_NATIVE: ${{ steps.classify.outputs.run_native }}
          PR_RUN_COMPILE: ${{ steps.classify.outputs.run_native_compile }}
          PR_RUN_GEOMETRY: ${{ steps.classify.outputs.run_geometry }}
          PR_MACOS_DEFERRED: ${{ steps.classify.outputs.macos_deferred }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_ACTION: ${{ github.event.action }}
          PR_LABEL: ${{ github.event.label.name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          PR_LABEL=${PR_LABEL,,}
          run_full=true
          run_e2e=false
          run_native=false
          run_native_compile=false
          run_geometry=true
          # Only a classified draft PR defers macOS (maru#625); push, dispatch
          # and unrelated label events never do.
          macos_deferred=false
          reason="this event requires verify; main avoids repeating PR-only checks"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            run_e2e=true
            run_native_compile=true
            reason="manual CI dispatch requests full verification"
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if { [ "$PR_ACTION" = "labeled" ] || [ "$PR_ACTION" = "unlabeled" ]; } && [ "$PR_LABEL" != "native-e2e" ]; then
              run_full=false
              run_geometry=false
              reason="unrelated label event; existing required CI check is unchanged"
            else
              run_full="$PR_RUN_FULL"
              run_e2e="$PR_RUN_E2E"
              run_native="$PR_RUN_NATIVE"
              run_native_compile="$PR_RUN_COMPILE"
              run_geometry="$PR_RUN_GEOMETRY"
              macos_deferred="$PR_MACOS_DEFERRED"
              reason="PR path/label policy selected validation"
              # A native label requests the suite, not another copy of already
              # successful verify/browser/compile work on this identical SHA.
              if [ "$PR_ACTION" = "labeled" ] || [ "$PR_ACTION" = "unlabeled" ]; then
                if merge_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha) \
                  && head_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$PR_HEAD_SHA" --jq .tree.sha) \
                  && [ "$merge_tree" = "$head_tree" ] \
                  && runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$PR_HEAD_SHA&status=completed&per_page=100"); then
                  expected_title="CI PR #$PR_NUMBER"
                  previous=$(jq -r --arg title "$expected_title" '[.workflow_runs[] | select(.display_title == $title)] | sort_by(.run_started_at) | last | .conclusion // ""' <<<"$runs")
                  if [ "$previous" = "success" ]; then
                    run_full=false
                    run_e2e=false
                    run_native_compile=false
                    run_geometry=false
                    reason="native label event reused successful CI on $PR_HEAD_SHA; current native intent is still enforced"
                  fi
                fi
              fi
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            reason="no exact successful pull request validation was found"
            # Use the same geometry path policy as PRs. Compare errors, initial
            # pushes and GitHub's 300-file cap keep the gate enabled.
            if [[ "$PUSH_BEFORE" =~ ^[a-f0-9]{40}$ ]] && [[ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]] \
              && gh api "repos/$GITHUB_REPOSITORY/compare/$PUSH_BEFORE...$GITHUB_SHA" > "$RUNNER_TEMP/ci-push.json" \
              && push_geometry=$(node scripts/ci-policy.mjs geometry-push "$RUNNER_TEMP/ci-push.json"); then
              run_geometry="$push_geometry"
            else
              echo "::warning::Could not classify pushed geometry paths; keeping the geometry matrix enabled. Inspect the compare API response before rerunning CI."
            fi

            if ! pulls=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100"); then
              echo "::warning::Could not resolve associated pull requests; running full CI."
            else
              pr=$(jq -c --arg sha "$GITHUB_SHA" \
                '[.[] | select(.merged_at != null and .merge_commit_sha == $sha)] | sort_by(.number) | last // empty' \
                <<<"$pulls")

              if [ -n "$pr" ]; then
                pr_number=$(jq -r .number <<<"$pr")
                head_sha=$(jq -r .head.sha <<<"$pr")

                if push_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha) \
                  && head_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" --jq .tree.sha) \
                  && runs=$(gh api \
                    "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head_sha&status=completed&per_page=20"); then
                  expected_title="CI PR #$pr_number"
                  latest_conclusion=$(jq -r --arg title "$expected_title" \
                    '[.workflow_runs[] | select(.display_title == $title)] | sort_by(.run_started_at) | last | .conclusion // ""' \
                    <<<"$runs")

                  if [ "$push_tree" = "$head_tree" ] && [ "$latest_conclusion" = "success" ]; then
                    run_full=false
                    reason="PR #$pr_number successfully validated the exact tree $push_tree"
                  elif [ "$push_tree" != "$head_tree" ]; then
                    reason="the merged tree differs from PR #$pr_number head"
                  else
                    reason="the latest CI run for PR #$pr_number is not successful"
                  fi
                else
                  echo "::warning::Could not verify the associated PR tree and run; running full CI."
                fi
              fi
            fi
          fi

          if [ "$run_full" = "false" ]; then
            run_geometry=false
          fi
          {
            echo "run_full=$run_full"
            echo "run_e2e=$run_e2e"
            echo "run_native=$run_native"
            echo "run_native_compile=$run_native_compile"
            echo "run_geometry=$run_geometry"
            echo "macos_deferred=$macos_deferred"
          } >> "$GITHUB_OUTPUT"
          echo "CI decision: $reason"
          if [ "$macos_deferred" = "true" ]; then
            echo "CI decision: draft PR; macOS jobs are deferred until the PR is marked ready (gh pr ready)"
          fi
          if [ "$run_full" = "false" ]; then
            {
              echo "### CI validation intent"
              echo "$reason. Jobs run only when their decision output requests them."
              echo "verify=$run_full e2e=$run_e2e native=$run_native compile=$run_native_compile"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    name: make verify
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check patch and detect a release version change
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          echo "release=false" >> "$GITHUB_OUTPUT"

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check
            exit 0
          fi

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          git diff --check "$BASE_SHA" "$GITHUB_SHA"

          base_version=$(git show "$BASE_SHA:package.json" \
            | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => console.log(JSON.parse(data).version));')
          current_version=$(node -p "require('./package.json').version")
          if [ "$base_version" != "$current_version" ]; then
            # The version band follows the active milestone (README, Release
            # Process), so a bump can jump minor. It must never go backwards:
            # a lower version overwrites latest.json and strands updaters.
            newest=$(printf '%s\n%s\n' "$base_version" "$current_version" | sort -V | tail -1)
            if [ "$newest" != "$current_version" ]; then
              echo "::error::release version went backwards: $base_version -> $current_version"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Release version changed: $base_version -> $current_version"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ubuntu-22.04-validation

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Select independent engine spike checks
        id: engine_e0
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/diagram-engine-e0.mjs needed

      - name: Check independent SDK, generated types and subtree extraction
        if: steps.engine_e0.outputs.needed == 'true'
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          node scripts/check-diagram-engine-boundary.mjs
          cargo fmt --manifest-path src-tauri/crates/Cargo.toml --all --check
          node scripts/diagram-engine-e0.mjs types
          bash scripts/check-diagram-engine-subtree.sh

      - name: Run verify (typecheck + version checks + guards + tests + frontend build)
        if: steps.changes.outputs.release != 'true'
        run: make verify

      - name: Run verify and release-only checks
        if: steps.changes.outputs.release == 'true'
        run: make release-checks

  e2e:
    name: playwright e2e
    needs: decision
    if: needs.decision.outputs.run_e2e == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # e2e used to run only in release-preflight, so a broken or flaky spec
      # first surfaced on the release tag instead of on the PR that caused it.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Select independent engine browser spike
        id: engine_e0
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/diagram-engine-e0.mjs needed

      - name: Setup the pinned Rust WebAssembly target for the spike only
        if: steps.engine_e0.outputs.needed == 'true'
        # Honour rust-toolchain.toml instead of installing an unused stable toolchain.
        run: rustup target add wasm32-unknown-unknown

      - name: Build and measure independent WebAssembly slice
        if: steps.engine_e0.outputs.needed == 'true'
        env:
          CARGO_BUILD_JOBS: 2
        run: node scripts/diagram-engine-e0.mjs wasm

      - name: Measure browser apply gate without the Node host override
        if: steps.engine_e0.outputs.needed == 'true'
        env:
          MARU_ENGINE_E0: '1'
        run: pnpm exec playwright test e2e/engine-e0.spec.ts --workers=1

      - name: Capture both engine SVG themes with pinned CJK fonts
        if: steps.engine_e0.outputs.needed == 'true'
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          node scripts/diagram-engine-e3-fonts.mjs --check
          node scripts/diagram-engine-e3-screenshots.mjs

      - name: Upload engine SVG visual review evidence
        if: steps.engine_e0.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diagram-e3-svg-screenshots
          path: .engine-e2/e3-screenshots/
          if-no-files-found: error
          retention-days: 7

      - name: Run e2e
        run: make test-e2e

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Other code PRs retain compile/typecheck coverage. Selected native PRs
  # call the full suite below, which already compiles the native feature.
  native-e2e-compile:
    name: native e2e compile check
    needs: decision
    if: needs.decision.outputs.run_native_compile == 'true' && needs.decision.outputs.macos_deferred != 'true'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-26-native-e2e-compile

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (includes e2e-native/)
        run: pnpm typecheck

      - name: Lint (includes e2e-native/)
        run: pnpm lint

      # generate_context!() requires frontendDist (../dist) at compile time
      # once native-e2e turns on tauri/custom-protocol; build it first.
      - name: Build frontend for native-e2e
        run: pnpm build:frontend:native-e2e

      # --locked, not --offline: a hosted runner has no warm registry cache on
      # a cold job, so --offline would fail for a reason unrelated to the code.
      - name: Cargo check with the native-e2e feature on
        run: cd src-tauri && cargo check --locked --features native-e2e

  # PR native scope is listed in native-e2e.yml and shared in ci-policy.mjs.
  # The reusable suite owns its 45-minute runner timeout; no second Mac compile.
  native-e2e:
    needs: decision
    if: needs.decision.outputs.run_native == 'true' && needs.decision.outputs.macos_deferred != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/native-e2e.yml

  # Pure SDK checks only. S1 hashes fixed arithmetic/font metrics; the next
  # stacked phase upgrades the same matrix to whole-scene geometry hashes.
  geometry-determinism:
    needs: decision
    if: needs.decision.outputs.run_geometry == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/diagram-determinism.yml
    # A deferred draft still runs the Linux, Windows and WASM legs (maru#625).
    with:
      macos: ${{ needs.decision.outputs.macos_deferred != 'true' }}

  ci-ok:
    name: ${{ (github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'native-e2e') && 'ci-label-ignored' || 'ci-ok' }}
    if: always()
    needs: [decision, verify, e2e, native-e2e-compile, native-e2e, geometry-determinism]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout CI policy
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci-policy.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Setup Node for policy only
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Require all intended gates
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-policy.mjs aggregate
