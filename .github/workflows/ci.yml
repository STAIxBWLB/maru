name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # dorny/paths-filter reads the PR file list via the API on pull_request runs.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HWP_CLI_VERSION: "0.4.1"
  HWP_CLI_SHA256: "61db250203d40d8aa528b14c380be0cf08e6bfdbecc0cd99748c0d7ec95326d5"
  HWP_CLI: ${{ github.workspace }}/.cache/hwp-cli/hwp
  HWPX_EXPECT_HWP_VERSION: "0.4.1"

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Classify the change so skill-only edits (OTA bundle content) skip the
      # heavy app toolchain. Unknown diffs classify as app changes (safe).
      - name: Classify changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            skills:
              - 'skills/**'
            app:
              - '!(skills/**)'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Setup Python for live HWPX skill tests
        if: steps.changes.outputs.skills == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: skills/skills/hwpx/requirements-test.txt

      - name: Install pinned hwp-cli for live HWPX skill tests
        if: steps.changes.outputs.skills == 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/hwp-${HWP_CLI_VERSION}-linux.tar.gz"
          mkdir -p "$(dirname "$HWP_CLI")"
          curl -fsSL --retry 3 \
            "https://github.com/STAIxBWLB/hwp-cli/releases/download/v${HWP_CLI_VERSION}/hwp-v${HWP_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$HWP_CLI_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$(dirname "$HWP_CLI")"
          test "$("$HWP_CLI" --version)" = "hwp ${HWP_CLI_VERSION}"
          "$HWP_CLI" new --help | grep -F -- "--preset"
          "$HWP_CLI" validate --help | grep -F -- "--json"
          "$HWP_CLI" fill --help >/dev/null
          "$HWP_CLI" slots --help >/dev/null

      - name: Verify skills bundle content
        if: steps.changes.outputs.skills == 'true'
        run: make skills-verify

      - name: Setup Rust
        if: steps.changes.outputs.app == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: steps.changes.outputs.app == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ci-ubuntu-22.04

      - name: Install Linux Tauri dependencies
        if: steps.changes.outputs.app == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        if: steps.changes.outputs.app == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run verify (typecheck + i18n lint + vitest + cargo test --lib + build)
        if: steps.changes.outputs.app == 'true'
        run: make verify

      # e2e used to run only in release-preflight, so a broken or flaky spec
      # first surfaced on the release tag instead of on the PR that caused it.
      - name: Install Playwright browsers
        if: steps.changes.outputs.app == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        if: steps.changes.outputs.app == 'true'
        run: make test-e2e

      - name: Upload e2e artifacts on failure
        if: failure() && steps.changes.outputs.app == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
