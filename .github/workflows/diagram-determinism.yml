name: diagram-determinism

on:
  workflow_call:

permissions:
  contents: read

jobs:
  matrix:
    name: SDK scene hashes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            receipt: linux
          - os: macos-26
            receipt: macos
          - os: windows-latest
            receipt: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Generate the same seeded dense and parity input
        run: |
          node scripts/diagram-engine-e2-dense.mjs --check
          node scripts/diagram-engine-e2-dense.mjs combine .engine-e2/determinism-corpus.json
      - name: Cache pure SDK
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/crates -> target
          shared-key: diagram-scene-${{ matrix.os }}
      - name: Hash whole scenes, both SVG themes and unchanged re-layouts for the complete corpus
        shell: bash
        run: |
          mkdir -p .engine-e2/determinism
          cargo test --locked --manifest-path src-tauri/crates/Cargo.toml -p maru-diagram-engine --features geometry-corpus --lib geometry_corpus -- --test-threads=2
          cargo test --locked --manifest-path src-tauri/crates/Cargo.toml -p maru-diagram-engine --features geometry-corpus --test work_budget -- --test-threads=2
          cargo run --locked --manifest-path src-tauri/crates/Cargo.toml -p maru-diagram-engine --features geometry-corpus --bin geometry-foundation-hashes -- .engine-e2/determinism-corpus.json .engine-e2/determinism/native-${{ matrix.receipt }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: diagram-scene-native-${{ matrix.receipt }}
          path: .engine-e2/determinism/native-${{ matrix.receipt }}.json
          if-no-files-found: error
          retention-days: 3

  wasm:
    name: SDK scene hashes (Linux WASM)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Generate the same seeded dense and parity input
        run: |
          node scripts/diagram-engine-e2-dense.mjs --check
          node scripts/diagram-engine-e2-dense.mjs combine .engine-e2/determinism-corpus.json
      - name: Cache pure SDK and bindgen tooling
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/crates -> target
          shared-key: diagram-scene-linux-wasm
      - name: Build the separate test-featured geometry WASM artifact
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          export MARU_DIAGRAM_ENGINE_REVISION=$(git rev-parse HEAD:src-tauri/crates)
          cargo build --locked --release --lib --manifest-path src-tauri/crates/Cargo.toml -p maru-diagram-engine --features wasm-render,geometry-corpus --target wasm32-unknown-unknown
          cargo run --locked --manifest-path src-tauri/crates/Cargo.toml -p maru-diagram-engine --features bindgen-web --bin bindgen-web -- src-tauri/crates/target/wasm32-unknown-unknown/release/maru_diagram_engine.wasm .engine-e2/wasm-test
      - name: Hash whole scenes through WASM without a Node engine override
        run: node scripts/diagram-engine-e2-wasm-hashes.mjs .engine-e2/determinism-corpus.json .engine-e2/determinism/wasm-linux.json .engine-e2/wasm-test
      - uses: actions/upload-artifact@v4
        with:
          name: diagram-scene-wasm-linux
          path: .engine-e2/determinism/wasm-linux.json
          if-no-files-found: error
          retention-days: 3

  compare:
    name: native and WASM scene hash agreement
    needs: [matrix, wasm]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/diagram-engine-e2-determinism.mjs
            scripts/diagram-engine-e2-dense.mjs
            src-tauri/crates/maru-diagram-engine/testdata/parity.json
            src-tauri/crates/maru-diagram-engine/testdata/dense-scenes.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Generate the same seeded dense and parity input
        run: |
          node scripts/diagram-engine-e2-dense.mjs --check
          node scripts/diagram-engine-e2-dense.mjs combine .engine-e2/determinism-corpus.json
      - uses: actions/download-artifact@v4
        with:
          pattern: diagram-scene-*
          path: .engine-e2/determinism
      - name: Require three native and one WASM scene/SVG report to agree
        run: node scripts/diagram-engine-e2-determinism.mjs .engine-e2/determinism .engine-e2/determinism-corpus.json

  png-native:
    name: PNG manifests (native ${{ matrix.receipt }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            receipt: native-linux
          - os: macos-26
            receipt: native-macos
          - os: windows-latest
            receipt: native-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Cache pinned PNG rasterizer
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/crates -> target
          shared-key: diagram-png-${{ matrix.os }}
      - name: Check PNG bounds, decoded pixels, receipts and refusal contracts
        run: cargo test --locked --manifest-path src-tauri/crates/Cargo.toml -p maru-diagram-engine --features render-png --test png_contract -- --test-threads=2
      - name: Execute all SVG integration suites with PNG enabled
        if: matrix.receipt == 'native-linux'
        run: node scripts/diagram-engine-e3-integration-coverage.mjs
      - name: Render all pinned scenes twice and record PNG, pixels, SVG and font pins
        shell: bash
        run: |
          mkdir -p .engine-e3/png
          if [ "${{ matrix.receipt }}" = "native-linux" ]; then
            cargo run --locked --manifest-path src-tauri/crates/Cargo.toml -p maru-diagram-engine --features png-corpus --bin png-manifest -- .engine-e3/png/${{ matrix.receipt }}.json --svg-parity-dir .engine-e3/png/svg-fixtures
          else
            cargo run --locked --manifest-path src-tauri/crates/Cargo.toml -p maru-diagram-engine --features png-corpus --bin png-manifest -- .engine-e3/png/${{ matrix.receipt }}.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: diagram-png-${{ matrix.receipt }}
          path: .engine-e3/png/${{ matrix.receipt }}.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: matrix.receipt == 'native-linux'
        with:
          name: diagram-svg-parity-fixtures
          path: .engine-e3/png/svg-fixtures/*.json
          if-no-files-found: error
          retention-days: 3

  png-wasm:
    name: PNG manifest (WASM Linux)
    needs: [png-native]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Cache isolated PNG and bindgen tooling
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/crates -> target
          shared-key: diagram-png-linux-wasm
      - name: Build test-featured PNG WASM and wrapper
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          export MARU_DIAGRAM_ENGINE_REVISION=$(git rev-parse HEAD:src-tauri/crates)
          cargo build --locked --release --lib --manifest-path src-tauri/crates/Cargo.toml -p maru-diagram-engine --features wasm-png,png-corpus --target wasm32-unknown-unknown
          cargo run --locked --manifest-path src-tauri/crates/Cargo.toml -p maru-diagram-engine --features bindgen-web --bin bindgen-web -- src-tauri/crates/target/wasm32-unknown-unknown/release/maru_diagram_engine.wasm .engine-e3/wasm-test
      - uses: actions/download-artifact@v4
        with:
          name: diagram-png-native-linux
          path: .engine-e3/native-linux
      - uses: actions/download-artifact@v4
        with:
          name: diagram-svg-parity-fixtures
          path: .engine-e3/svg-fixtures
      - name: Render the same PNG manifest through WASM
        run: node scripts/diagram-engine-e3-png-determinism.mjs --wasm .engine-e3/png/wasm-linux.json .engine-e3/wasm-test
      - name: Require native PNG SVG bytes to match WASM render_scene_svg
        run: node scripts/diagram-engine-e3-png-determinism.mjs --wasm-svg-parity .engine-e3/svg-fixtures .engine-e3/native-linux/native-linux.json .engine-e3/wasm-test .engine-e3/png/svg-parity.json
      - uses: actions/upload-artifact@v4
        with:
          name: diagram-png-wasm-linux
          path: .engine-e3/png/wasm-linux.json
          if-no-files-found: error
          retention-days: 3

  png-compare:
    name: PNG native and WASM determinism
    needs: [png-native, png-wasm]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/diagram-engine-e3-png-determinism.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: diagram-png-*
          path: .engine-e3/png
      - name: Require strict bytes and decoded pixel hashes across all four builds
        run: node scripts/diagram-engine-e3-png-determinism.mjs .engine-e3/png
