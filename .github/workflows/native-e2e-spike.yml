# CI-viability spike for the native e2e runner (Phase 06, plan 06-01 Task 3).
#
# Disposable on purpose: workflow_dispatch only, its own file, so ci.yml stays
# untouched (plan 06-05 owns whatever lands there) and a branch push can never
# fire a 30-minute macOS build by accident.
#
# What one run proves: whether the embedded WebDriver provider establishes a
# session on a hosted macOS runner with NO interactive permission prompt
# (D-01's first condition). Classification follows D-02 only:
#   - a visible interactive/TCC permission dialog (or a hang whose screenshot
#     shows one) => verdict local-only, stop immediately, no retries;
#   - any other failure class => ordinary debugging, retried within a cap of
#     THREE hosted runs total (see docs/native-e2e.md "Spike log").
#
# Evidence is uploaded unconditionally so a hang leaves something to look at:
# the wdio/make log and a screencapture of the runner's screen at failure time.
# timeout-minutes is set low enough that a modal-dialog hang surfaces as a
# timeout instead of burning the 6-hour default.

name: native-e2e-spike

on:
  workflow_dispatch:

jobs:
  spike:
    name: hosted macOS session-establishment spike
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-14-native-e2e

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the native e2e suite
        id: suite
        run: make test-e2e-native 2>&1 | tee /tmp/native-e2e-run.log

      - name: Capture screen evidence on failure or timeout
        if: failure() || cancelled()
        run: |
          mkdir -p /tmp/spike-evidence
          screencapture -x /tmp/spike-evidence/screen.png 2>&1 || echo "screencapture failed (itself telling): $?"
          cp /tmp/native-e2e-run.log /tmp/spike-evidence/run.log 2>/dev/null || true
          ls -la /tmp/spike-evidence

      - name: Capture log on success
        if: success()
        run: |
          mkdir -p /tmp/spike-evidence
          cp /tmp/native-e2e-run.log /tmp/spike-evidence/run.log

      - name: Upload spike evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-spike-evidence
          path: /tmp/spike-evidence/
          if-no-files-found: warn
