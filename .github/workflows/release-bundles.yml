name: Release Bundles

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Pending tag of an existing draft, targeted at a full verified SHA (vX.Y.Z)."
        required: true
        type: string
      dry_run:
        description: "Rehearsal: upload and verify draft assets, never publish or update Homebrew."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-bundles-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  APPLE_SIGNING_IDENTITY: "-"

jobs:
  prepare:
    name: Validate release inputs
    runs-on: ubuntu-latest
    # Gate waits up to 50 minutes (native suite 45 + queue margin), with
    # another 10 minutes for checkout/setup and validation.
    timeout-minutes: 60
    permissions:
      # Releases API hides drafts without push access, even for read requests.
      # Admission itself only reads; the token must still be write-capable.
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      id: ${{ steps.release.outputs.id }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      # Read admission code from this workflow's revision, not an older tag
      # that may predate the gate. No dependencies or release assets are built.
      - name: Checkout release gate tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-checks
          sparse-checkout: scripts
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Admit draft ID and immutable target through CI and native E2E
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .release-checks/scripts/release-draft.mjs prepare "$RELEASE_TAG"

      - name: Checkout verified release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate tag and version surfaces
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/check-release-version.mjs --tag "$RELEASE_TAG"

      - name: Validate release secrets
        shell: bash
        env:
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD != '' }}
          HAS_APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          HAS_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          missing=()
          check_secret() {
            if [ "$2" != "true" ]; then
              missing+=("$1")
            fi
          }

          check_secret APPLE_CERTIFICATE "$HAS_APPLE_CERTIFICATE"
          check_secret APPLE_CERTIFICATE_PASSWORD "$HAS_APPLE_CERTIFICATE_PASSWORD"
          check_secret KEYCHAIN_PASSWORD "$HAS_KEYCHAIN_PASSWORD"
          check_secret APPLE_API_ISSUER_ID "$HAS_APPLE_API_ISSUER_ID"
          check_secret APPLE_API_KEY "$HAS_APPLE_API_KEY"
          check_secret APPLE_API_KEY_ID "$HAS_APPLE_API_KEY_ID"
          check_secret TAURI_SIGNING_PRIVATE_KEY "$HAS_TAURI_SIGNING_PRIVATE_KEY"
          check_secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$HAS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ "$DRY_RUN" != "true" ]; then
            check_secret HOMEBREW_TAP_TOKEN "$HAS_HOMEBREW_TAP_TOKEN"
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing release secret(s): %s. Configure them in repository Actions secrets and retry Release Bundles.\n' "${missing[*]}"
            exit 1
          fi
          echo "All required release secrets are present."

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.args }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_ID: ${{ needs.prepare.outputs.id }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      DRY_RUN: ${{ inputs.dry_run }}

    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        include:
          - platform: macos-26
            args: --target aarch64-apple-darwin --bundles app
            cache_key: macos-26-aarch64
            cli_target: aarch64-apple-darwin
            cli_arch: aarch64
            dmg_arch: aarch64
          - platform: macos-26
            args: --target x86_64-apple-darwin --bundles app
            cache_key: macos-26-x86_64
            cli_target: x86_64-apple-darwin
            cli_arch: x86_64
            dmg_arch: x64
          - platform: ubuntu-22.04
            args: ""
            cache_key: ubuntu-22.04
            cli_target: ""
            cli_arch: ""
            dmg_arch: ""
          # Intentionally tracks latest. The Visual Studio 2026 migration of
          # windows-latest is accepted and covered by the release matrix.
          - platform: windows-latest
            args: ""
            cache_key: windows-latest
            cli_target: ""
            cli_arch: ""
            dmg_arch: ""

    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # Credential tooling follows the workflow revision, so rebuilding a tag
      # that predates this helper still uses the current credential format.
      - name: Checkout release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # rust-toolchain.toml pins the channel (GATE-05), so cargo resolves to the
      # pinned toolchain rather than the stable one the action installed. Adding
      # a target through the action's `targets:` input adds it to stable, which
      # the build never uses. Run rustup from the repo so each macOS matrix leg
      # installs only its own target into the pinned toolchain.
      - name: Add macOS target to the pinned toolchain
        if: matrix.platform == 'macos-26'
        env:
          TARGET: ${{ matrix.cli_target }}
        run: rustup target add "$TARGET"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.cache_key }}

      - name: Install Linux bundle dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare macOS signing
        if: matrix.platform == 'macos-26'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$CERT_ID" ]; then
            echo "Developer ID Application certificate not found in imported keychain." >&2
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        if: matrix.platform == 'macos-26'
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/maru-notary-auth.p8"
          source .release-tools/scripts/lib/notary-key.sh
          write_notary_key "$key_file"
          echo "APPLE_API_KEY_PATH=$key_file" >> "$GITHUB_ENV"

      - name: Confirm the admitted draft before bundle upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .release-tools/scripts/release-draft.mjs assert "$RELEASE_TAG" "$RELEASE_ID" "$RELEASE_SHA"

      # Each leg uploads only its unique bundles and signatures. The finalizer
      # writes latest.json once after every platform succeeds.
      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '' }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-26' && secrets.APPLE_API_ISSUER_ID || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-26' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          includeUpdaterJson: false
          assetNamePattern: Maru_[version]_[platform]_[arch]_[bundle][ext]

      - name: Build and upload standalone macOS CLI
        if: matrix.cli_target != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.cli_target }}
          ASSET_ARCH: ${{ matrix.cli_arch }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cargo build --manifest-path src-tauri/Cargo.toml --release -p maru-cli --bin maru-cli --target "$TARGET"
          staging="$RUNNER_TEMP/maru-cli-$ASSET_ARCH"
          mkdir -p "$staging"
          install -m 0755 "src-tauri/target/$TARGET/release/maru-cli" "$staging/maru"
          asset="maru-cli_${version}_darwin_${ASSET_ARCH}.tar.gz"
          tar -czf "$asset" -C "$staging" maru
          shasum -a 256 "$asset" | awk '{print $1}' > "$asset.sha256"
          node .release-tools/scripts/release-draft.mjs upload "$RELEASE_TAG" "$RELEASE_ID" "$RELEASE_SHA" "$asset" "$asset.sha256"

      # tauri-action intentionally builds only the app updater archive on
      # macOS. Create and publish a DMG only after independent notarization,
      # stapling, and Gatekeeper-facing validation.
      - name: Build, notarize, staple, and upload macOS disk image
        if: matrix.cli_target != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.cli_target }}
          ASSET_ARCH: ${{ matrix.dmg_arch }}
        run: |
          set -euo pipefail
          pnpm tauri bundle --target "$TARGET" --bundles dmg --ci
          shopt -s nullglob
          dmgs=(src-tauri/target/*/release/bundle/dmg/*.dmg)
          shopt -u nullglob
          if [ "${#dmgs[@]}" -ne 1 ]; then
            printf '::error::Expected exactly one macOS DMG, found %s.\n' "${#dmgs[@]}"
            exit 1
          fi

          dmg="${dmgs[0]}"
          if ! xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait; then
            echo "::error::API-key notarization failed. Inspect notarytool output and App Store Connect credentials, then retry Release Bundles."
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"

          version="${RELEASE_TAG#v}"
          asset="$RUNNER_TEMP/Maru_${version}_darwin_${ASSET_ARCH}_dmg.dmg"
          cp "$dmg" "$asset"
          node .release-tools/scripts/release-draft.mjs upload "$RELEASE_TAG" "$RELEASE_ID" "$RELEASE_SHA" "$asset"

      - name: Remove temporary App Store Connect API key
        if: always() && matrix.platform == 'macos-26'
        shell: bash
        run: |
          if ! rm -f "$RUNNER_TEMP/maru-notary-auth.p8"; then
            echo "::error::Cannot remove the temporary notarization key. Inspect runner temporary-directory permissions before retrying Release Bundles."
            exit 1
          fi

  finalize:
    name: Verify draft assets, publish, then update Homebrew
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_ID: ${{ needs.prepare.outputs.id }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Checkout verified Maru release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Checkout finalization tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            scripts
            packaging/homebrew
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Upload draft updater manifest
        working-directory: .release-tools
        env:
          GH_TOKEN: ${{ github.token }}
          MARU_RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/publish-updater-manifest.mjs "$RELEASE_TAG"

      - name: Verify all 21 draft assets and publish unless rehearsing
        id: publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .release-tools/scripts/release-draft.mjs finalize "$RELEASE_TAG" "$RELEASE_ID" "$RELEASE_SHA"

      - name: Checkout Homebrew tap
        if: steps.publication.outputs.published == 'true'
        uses: actions/checkout@v5
        with:
          repository: STAIxBWLB/homebrew-cask
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Configure git identity
        if: steps.publication.outputs.published == 'true'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Render and push tap update
        if: steps.publication.outputs.published == 'true'
        working-directory: .release-tools
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/update-homebrew-tap.mjs "$TAG" ../tap --commit --push
