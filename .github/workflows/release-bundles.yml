name: Release Bundles

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build. Must already exist (e.g. v0.2.13)."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-bundles-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  APPLE_SIGNING_IDENTITY: "-"

jobs:
  prepare:
    name: Validate release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      id: ${{ steps.release.outputs.id }}

    steps:
      - name: Resolve release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_ID: ${{ github.event.release.id }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_ID" ]; then
            tag="$EVENT_TAG"
            id="$EVENT_ID"
          else
            tag="$INPUT_TAG"
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Resolved release: tag=$tag id=$id"

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate tag and version surfaces
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/check-release-version.mjs --tag "$RELEASE_TAG"

      - name: Validate release secrets
        shell: bash
        env:
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          HAS_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          set -euo pipefail
          missing=()
          check_secret() {
            if [ "$2" != "true" ]; then
              missing+=("$1")
            fi
          }

          check_secret APPLE_CERTIFICATE "$HAS_APPLE_CERTIFICATE"
          check_secret APPLE_CERTIFICATE_PASSWORD "$HAS_APPLE_CERTIFICATE_PASSWORD"
          check_secret KEYCHAIN_PASSWORD "$HAS_KEYCHAIN_PASSWORD"
          check_secret APPLE_ID "$HAS_APPLE_ID"
          check_secret APPLE_PASSWORD "$HAS_APPLE_PASSWORD"
          check_secret APPLE_TEAM_ID "$HAS_APPLE_TEAM_ID"
          check_secret TAURI_SIGNING_PRIVATE_KEY "$HAS_TAURI_SIGNING_PRIVATE_KEY"
          check_secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$HAS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          check_secret HOMEBREW_TAP_TOKEN "$HAS_HOMEBREW_TAP_TOKEN"

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing release secret(s): %s\n' "${missing[*]}"
            exit 1
          fi
          echo "All required release secrets are present."

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.args }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app
            cache_key: macos-aarch64
            cli_target: aarch64-apple-darwin
            cli_arch: aarch64
            dmg_arch: aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app
            cache_key: macos-x86_64
            cli_target: x86_64-apple-darwin
            cli_arch: x86_64
            dmg_arch: x64
          - platform: ubuntu-22.04
            args: ""
            cache_key: ubuntu-22.04
            cli_target: ""
            cli_arch: ""
            dmg_arch: ""
          # Intentionally tracks latest. The Visual Studio 2026 migration of
          # windows-latest is accepted and covered by the release matrix.
          - platform: windows-latest
            args: ""
            cache_key: windows-latest
            cli_target: ""
            cli_arch: ""
            dmg_arch: ""

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # rust-toolchain.toml pins the channel (GATE-05), so cargo resolves to the
      # pinned toolchain rather than the stable one the action installed. Adding
      # targets through the action's `targets:` input adds them to stable, which
      # the build never uses - the v0.4.63 macOS Intel job failed on exactly that
      # ("Target x86_64-apple-darwin is not installed"). Run rustup from the repo
      # so it resolves the pinned toolchain and installs the targets there.
      - name: Add macOS cross targets to the pinned toolchain
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.cache_key }}

      - name: Install Linux bundle dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare macOS signing
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$CERT_ID" ]; then
            echo "Developer ID Application certificate not found in imported keychain." >&2
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      # Each leg uploads only its unique bundles and signatures. The finalizer
      # writes latest.json once after every platform succeeds.
      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '' }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          includeUpdaterJson: false
          assetNamePattern: Maru_[version]_[platform]_[arch]_[bundle][ext]

      - name: Build and upload standalone macOS CLI
        if: matrix.cli_target != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.cli_target }}
          ASSET_ARCH: ${{ matrix.cli_arch }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cargo build --manifest-path src-tauri/Cargo.toml --release -p maru-cli --bin maru-cli --target "$TARGET"
          staging="$RUNNER_TEMP/maru-cli-$ASSET_ARCH"
          mkdir -p "$staging"
          install -m 0755 "src-tauri/target/$TARGET/release/maru-cli" "$staging/maru"
          asset="maru-cli_${version}_darwin_${ASSET_ARCH}.tar.gz"
          tar -czf "$asset" -C "$staging" maru
          shasum -a 256 "$asset" | awk '{print $1}' > "$asset.sha256"
          gh release upload "$RELEASE_TAG" "$asset" "$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      # tauri-action intentionally builds only the app updater archive on
      # macOS. Create and publish a DMG only after independent notarization,
      # stapling, and Gatekeeper-facing validation.
      - name: Build, notarize, staple, and upload macOS disk image
        if: matrix.cli_target != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.cli_target }}
          ASSET_ARCH: ${{ matrix.dmg_arch }}
        run: |
          set -euo pipefail
          pnpm tauri bundle --target "$TARGET" --bundles dmg --ci
          shopt -s nullglob
          dmgs=(src-tauri/target/*/release/bundle/dmg/*.dmg)
          shopt -u nullglob
          if [ "${#dmgs[@]}" -ne 1 ]; then
            printf '::error::Expected exactly one macOS DMG, found %s.\n' "${#dmgs[@]}"
            exit 1
          fi

          dmg="${dmgs[0]}"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"

          version="${RELEASE_TAG#v}"
          asset="$RUNNER_TEMP/Maru_${version}_darwin_${ASSET_ARCH}_dmg.dmg"
          cp "$dmg" "$asset"
          gh release upload "$RELEASE_TAG" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  finalize:
    name: Publish updater manifest and Homebrew tap
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Maru release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Publish updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          MARU_RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/publish-updater-manifest.mjs "$RELEASE_TAG"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: STAIxBWLB/homebrew-cask
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Configure git identity
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Render and push tap update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/update-homebrew-tap.mjs "$TAG" tap --commit --push
