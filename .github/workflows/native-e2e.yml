# Full real-app suite for main/tag/dispatch, reusable from CI for selected PRs.
# PR execution goes through ci.yml so ci-ok directly needs its result; there
# is no duplicate standalone PR run and no cross-workflow polling.
# Main/tag runs retain exact-release-SHA receipts for the release gate; PR
# head/tree receipts alone cannot certify the later main/tag commit.
# PR scope, derived from native fixtures, IPC, window/menu/child-view and PTY
# owners (predicate SSOT: scripts/ci-policy.mjs), or the native-e2e label:
# - e2e-native/**
# - src-tauri/crates/**
# - src-tauri/src/terminal/**
# - src-tauri/capabilities/**
# - src-tauri/permissions/**
# - src/components/sites/**
# - src/lib/terminal*
# - src-tauri/src/ipc_policy.rs
# - src-tauri/src/channel_delivery.rs
# - src-tauri/src/lib.rs
# - src-tauri/src/main.rs
# - src-tauri/src/diagram_engine_e0.rs
# - src-tauri/src/app_menu.rs
# - src-tauri/src/site_view.rs
# - src-tauri/src/site_launcher.rs
# - src-tauri/src/native_e2e.rs
# - src-tauri/src/browser_passkeys.rs
# - src-tauri/src/paths.rs
# - src-tauri/src/terminal_hooks.rs
# - src-tauri/build.rs
# - src-tauri/tauri.conf.json
# - src-tauri/Cargo.toml
# - src-tauri/Cargo.lock
# - package.json
# - pnpm-lock.yaml
# - src/App.tsx
# - src/lib/menu.ts
# - src/lib/windowLayout.ts
# - src/lib/useDestructiveActionGuard.ts
# - src/lib/siteView.ts
# - src/lib/nativeE2eBridge.ts
# - src/components/NativeTerminalView.tsx
# - src/components/TerminalPanel.tsx
# - src/components/skills/SkillEditorWindow.tsx
# - .github/workflows/ci.yml
# - .github/workflows/native-e2e.yml
# - scripts/ci-policy.mjs

name: native-e2e

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - docs/**
      - .planning/**
      - .github/**/*.md
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A reusable call inherits the caller context. This native-only prefix
  # cannot collide with ci-* or with the main/tag groups.
  group: native-e2e-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  native-e2e-suite:
    name: native e2e suite (real app, macOS)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-26-native-e2e

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The .hwpx editor spec renders a real document through the HWP engine,
      # which the app resolves from PATH (`ahwp` first, else the 1.x `hwp`
      # compatibility name). The tap installs the engine project's prebuilt
      # release binary: no Rust build, and `render --format svg` ships glyph
      # outlines rather than text, so no font package is involved. Homebrew
      # refuses to load a formula from a third-party tap until it is trusted,
      # so the step trusts this one formula of this one tap, and the install
      # below is the check that the trust took. The app enforces its own
      # version floor, so an incompatible engine release fails this job loudly
      # instead of being skipped over.
      - name: Install the HWP engine
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap staixbwlb/hwp https://github.com/STAIxBWLB/agent-hwp
          brew trust --formula staixbwlb/hwp/ahwp
          brew install ahwp
          ahwp --version

      # An explicit `shell: bash` runs with `-o pipefail`; the implicit default
      # (`bash -e`) does not, so the step took tee's exit status and stayed
      # green while spec files failed (#368).
      - name: Run the native e2e suite
        id: suite
        shell: bash
        run: |
          export MARU_DIAGRAM_ENGINE_REVISION=$(git rev-parse HEAD:src-tauri/crates)
          make test-e2e-native 2>&1 | tee /tmp/native-e2e-run.log

      # Evidence on failure: the wdio/make log and a screencapture of the
      # runner's screen, so a modal-permission hang is diagnosable from the
      # artifact alone (D-02's failure classification depends on it).
      - name: Capture failure evidence
        if: failure() || cancelled()
        run: |
          mkdir -p /tmp/native-e2e-evidence
          screencapture -x /tmp/native-e2e-evidence/screen.png 2>&1 || echo "screencapture failed (itself telling): $?"
          cp /tmp/native-e2e-run.log /tmp/native-e2e-evidence/run.log 2>/dev/null || true
          ls -la /tmp/native-e2e-evidence

      - name: Upload wdio output on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-evidence
          path: /tmp/native-e2e-evidence/
          if-no-files-found: warn
          retention-days: 7
