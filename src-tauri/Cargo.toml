[package]
name = "maru"
version = "1.1.1"
description = "Local-first Maru Workspace and AI editing desktop app"
authors = ["Maru Contributors"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"
default-run = "maru"

[lib]
name = "maru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "maru"
path = "src/main.rs"

[workspace]
members = [".", "maru-cli"]
default-members = ["."]
resolver = "2"

[features]
default = []
# Default-off: gates the embedded WebDriver plugin so it never compiles
# into a release build (D-10, T-06-01). Enabled only by
# `make test-e2e-native` / `cargo build --features native-e2e`.
#
# `tauri/custom-protocol` is load-bearing, not incidental: tauri's build
# script compiles the crate in dev mode whenever custom-protocol is off
# (`let dev = !custom_protocol` in tauri's build.rs), so a plain
# `cargo build` binary points its window at devUrl and embeds no assets.
# The runner has no vite dev server; without this feature the webview
# stays on about:blank forever (the 06-01 white-screen bug).
native-e2e = ["dep:tauri-plugin-wdio-webdriver", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "5"
encoding_rs = "0.8"
include_dir = "0.7"
mime_guess = "2"
minisign-verify = "0.2"
notify = "6"
portable-pty = "0.8"
quick-xml = "0.39.2"
rayon = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
similar = "2"
tauri = { version = "2.10.0", features = ["protocol-asset", "unstable"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
tempfile = "3"
trash = "=4.1.1"
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
walkdir = "2"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation-sys = "0.8.7"
objc2 = "0.6.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
