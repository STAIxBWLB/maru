[workspace]
members = ["maru-diagram-engine", "tauri-plugin-maru-diagram"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "=0.2.118"
wasm-bindgen-cli-support = "=0.2.118"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
tauri = { version = "=2.12.5", default-features = false }
