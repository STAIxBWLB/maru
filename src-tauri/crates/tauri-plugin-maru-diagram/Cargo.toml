[package]
name = "tauri-plugin-maru-diagram"
version = "0.1.0"
edition = "2021"
rust-version = "1.90.0"
license = "UNLICENSED"
description = "Tauri 2 adapter for the standalone Maru diagram engine"
links = "tauri-plugin-maru-diagram"
build = "build.rs"

[features]
default = []
png = ["maru-diagram-engine/render-png"]
# Outlined SVG export: native only, because it carries the pinned CJK faces.
outline = ["maru-diagram-engine/render-outline"]
render-store = ["maru-diagram-engine/render-png", "maru-diagram-engine/render-outline"]

[dependencies]
maru-diagram-engine = { path = "../maru-diagram-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", default-features = false }

[target.'cfg(unix)'.dependencies]
# `openat` with `O_NOFOLLOW` for the scanner: every read is resolved from a
# directory handle on the authorized root, so a folder replaced with a symbolic
# link mid-scan cannot redirect it. Unix only. The app workspace already links
# rustix through tauri; this crate workspace's lockfile gains it plus `errno`
# and `linux-raw-sys`.
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

[build-dependencies]
tauri-plugin = { version = "=2.7.2", features = ["build"] }

[dev-dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["test"] }

# This fixture exercises the complete production handler set; default-feature
# consumers keep the validation-only contract and do not compile render DTOs.
[[test]]
name = "command_isolation"
required-features = ["png", "outline", "render-store"]
