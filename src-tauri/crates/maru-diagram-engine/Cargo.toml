[package]
name = "maru-diagram-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.90.0"
license = "UNLICENSED"
description = "Maru's independent typed diagram validation engine"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]
typegen = ["dep:ts-rs"]
geometry = []
# Test/CI corpus tooling is never linked by the normal lazy geometry build.
geometry-corpus = ["geometry", "render-svg"]
render-svg = ["geometry", "dep:roxmltree"]
wasm-render = ["wasm-layout", "render-svg"]
wasm-layout = ["geometry", "dep:wasm-bindgen"]
font-tools = ["dep:ttf-parser"]
bindgen-web = ["wasm", "dep:wasm-bindgen-cli-support"]

[dependencies]
roxmltree = { version = "=0.21.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
ttf-parser = { version = "=0.25.1", optional = true }
sha2 = "0.10"
wasm-bindgen = { version = "=0.2.118", optional = true }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"], optional = true }
wasm-bindgen-cli-support = { version = "=0.2.118", optional = true }

[[bin]]
name = "export-types"
path = "src/bin/export_types.rs"
required-features = ["typegen"]

[[bin]]
name = "bindgen-web"
path = "src/bin/bindgen_web.rs"
required-features = ["bindgen-web"]

[[bin]]
name = "build-font-metrics"
path = "src/bin/build_font_metrics.rs"
required-features = ["font-tools"]

[[bin]]
name = "geometry-foundation-hashes"
path = "src/bin/geometry_foundation_hashes.rs"
required-features = ["geometry-corpus"]

[[bin]]
name = "geometry-work"
path = "src/bin/geometry_work.rs"
required-features = ["geometry-corpus"]

[[bin]]
name = "export-notdef"
path = "src/bin/export_notdef.rs"
required-features = ["font-tools"]
